<polygon points="46.00,410.00 43.80,405.00 48.20,405.00" fill="#7a7d85"/>
<text x="50.00" y="263.00" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#7a7d85" text-anchor="start" font-weight="normal" font-style="normal">60</text>
<line x1="404.00" y1="260.00" x2="404.00" y2="410.00" stroke="#7a7d85" stroke-width="0.8"/>
