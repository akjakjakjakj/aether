<text x="40.00" y="60.00" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#7a7d85" text-anchor="start" font-weight="normal" font-style="normal">All dimensions in millimetres. Depths are measured from the HEATED face. Generated by cad/make_sensor_drawing.py — do not hand-edit.</text>
