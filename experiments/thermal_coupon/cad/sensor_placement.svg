<text x="408.00" y="338.00" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#7a7d85" text-anchor="start" font-weight="normal" font-style="normal">30 insertion</text>
<text x="70.00" y="444.00" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#7a7d85" text-anchor="start" font-weight="normal" font-style="normal">hole entry positions, measured from the left edge</text>
<text x="70.00" y="458.00" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#7a7d85" text-anchor="start" font-weight="normal" font-style="normal">● junction on the centreline    ▬ drilled hole ⌀1.2</text>
<text x="560.00" y="116.00" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1b1b1e" text-anchor="start" font-weight="bold" font-style="normal">SECTION — through the centreline</text>
<text x="560.00" y="130.00" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#7a7d85" text-anchor="start" font-weight="normal" font-style="italic">thickness shown at 3× the in-plane scale</text>
<rect x="560.00" y="150.00" width="300.00" height="150.00" fill="#f6f7f9" stroke="#1b1b1e" stroke-width="1.2"/>
<rect x="560.00" y="138.00" width="300.00" height="12.00" fill="#f3ded9" stroke="#c1442a" stroke-width="1.0"/>
<text x="710.00" y="147.00" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#c1442a" text-anchor="middle" font-weight="bold" font-style="normal">HEATER — heated face</text>
<text x="868.00" y="304.00" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#2f5d8f" text-anchor="start" font-weight="normal" font-style="normal">back face → room air</text>
<line x1="560.00" y1="150.00" x2="860.00" y2="150.00" stroke="#7a7d85" stroke-width="0.6" stroke-dasharray="3 3"/>
<circle cx="635.00" cy="150.00" r="4.0" fill="#c1442a" stroke="#ffffff" stroke-width="1.3"/>
<text x="868.00" y="153.50" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#1b1b1e" text-anchor="start" font-weight="normal" font-style="normal">x = 0 mm</text>
<line x1="560.00" y1="180.00" x2="860.00" y2="180.00" stroke="#7a7d85" stroke-width="0.6" stroke-dasharray="3 3"/>
<circle cx="685.00" cy="180.00" r="4.0" fill="#c1442a" stroke="#ffffff" stroke-width="1.3"/>
<text x="868.00" y="183.50" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#1b1b1e" text-anchor="start" font-weight="normal" font-style="normal">x = 2 mm</text>
<line x1="560.00" y1="225.00" x2="860.00" y2="225.00" stroke="#7a7d85" stroke-width="0.6" stroke-dasharray="3 3"/>
<circle cx="735.00" cy="225.00" r="4.0" fill="#c1442a" stroke="#ffffff" stroke-width="1.3"/>
<text x="868.00" y="228.50" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#1b1b1e" text-anchor="start" font-weight="normal" font-style="normal">x = 5 mm</text>
<line x1="560.00" y1="285.00" x2="860.00" y2="285.00" stroke="#7a7d85" stroke-width="0.6" stroke-dasharray="3 3"/>
<circle cx="785.00" cy="285.00" r="4.0" fill="#c1442a" stroke="#ffffff" stroke-width="1.3"/>
<text x="868.00" y="288.50" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#1b1b1e" text-anchor="start" font-weight="normal" font-style="normal">x = 9 mm</text>
<line x1="538.00" y1="150.00" x2="538.00" y2="300.00" stroke="#7a7d85" stroke-width="0.8"/>
<polygon points="538.00,150.00 535.80,155.00 540.20,155.00" fill="#7a7d85"/>
<polygon points="538.00,300.00 535.80,295.00 540.20,295.00" fill="#7a7d85"/>
<text x="542.00" y="228.00" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#7a7d85" text-anchor="start" font-weight="normal" font-style="normal">10</text>
<text x="560.00" y="326.00" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#7a7d85" text-anchor="start" font-weight="normal" font-style="normal">Wires run along isotherms (into the page), never across the gradient.</text>
<text x="40.00" y="500.00" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1b1b1e" text-anchor="start" font-weight="bold" font-style="normal">NOTES</text>
<text x="40.00" y="518.00" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#c1442a" text-anchor="start" font-weight="bold" font-style="normal">1.</text>
<text x="62.00" y="518.00" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#1b1b1e" text-anchor="start" font-weight="normal" font-style="normal">Drill or print the sensor holes PARALLEL to the heated face, entering from one side edge. A wire that runs across the</text>
<text x="62.00" y="530.50" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#1b1b1e" text-anchor="start" font-weight="normal" font-style="normal">temperature gradient conducts heat to its own junction and reads low.</text>
<text x="40.00" y="549.00" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#c1442a" text-anchor="start" font-weight="bold" font-style="normal">2.</text>
<text x="62.00" y="549.00" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#1b1b1e" text-anchor="start" font-weight="normal" font-style="normal">Hole diameter ⌀1.2 mm, insertion 30 mm so every junction sits on the centreline, as far from the side edges as</text>
<text x="62.00" y="561.50" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#1b1b1e" text-anchor="start" font-weight="normal" font-style="normal">possible.</text>
<text x="40.00" y="580.00" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#c1442a" text-anchor="start" font-weight="bold" font-style="normal">3.</text>
<text x="62.00" y="580.00" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#1b1b1e" text-anchor="start" font-weight="normal" font-style="normal">Back-fill each hole with a thermally conductive paste or the same polymer, so the junction is not sitting in an air</text>
<text x="62.00" y="592.50" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#1b1b1e" text-anchor="start" font-weight="normal" font-style="normal">pocket. An unfilled hole is an insulating void and will read low and lag.</text>
<text x="40.00" y="611.00" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#c1442a" text-anchor="start" font-weight="bold" font-style="normal">4.</text>
<text x="62.00" y="611.00" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#1b1b1e" text-anchor="start" font-weight="normal" font-style="normal">The 0 mm sensor sits in a shallow surface groove under the heater, not free-standing on the face. Record the ACTUAL</text>
<text x="62.00" y="623.50" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#1b1b1e" text-anchor="start" font-weight="normal" font-style="normal">depth achieved, with an uncertainty, in the metadata sidecar — the model is fitted against the declared depth, so a</text>
<text x="62.00" y="636.00" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#1b1b1e" text-anchor="start" font-weight="normal" font-style="normal">0.5 mm error there becomes a property error.</text>
<text x="40.00" y="654.50" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#c1442a" text-anchor="start" font-weight="bold" font-style="normal">5.</text>
<text x="62.00" y="654.50" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#1b1b1e" text-anchor="start" font-weight="normal" font-style="normal">Measure every depth after installation (calipers on a sectioned scrap coupon printed in the same job, or an X-ray/CT</text>
<text x="62.00" y="667.00" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#1b1b1e" text-anchor="start" font-weight="normal" font-style="normal">if available). Nominal depths are a drawing; measured depths are data.</text>
<text x="40.00" y="685.50" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#c1442a" text-anchor="start" font-weight="bold" font-style="normal">6.</text>
<text x="62.00" y="685.50" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#1b1b1e" text-anchor="start" font-weight="normal" font-style="normal">Route wires out through the holder's wire gap with strain relief. A tugged thermocouple moves, and a moved</text>
<text x="62.00" y="698.00" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#1b1b1e" text-anchor="start" font-weight="normal" font-style="normal">thermocouple invalidates every run after it moved.</text>
</svg>
