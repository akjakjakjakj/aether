<text x="295.00" y="426.00" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#7a7d85" text-anchor="middle" font-weight="normal" font-style="normal">45</text>
<text x="295.00" y="252.00" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#c1442a" text-anchor="middle" font-weight="bold" font-style="normal">9 mm</text>
